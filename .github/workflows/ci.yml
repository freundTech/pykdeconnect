name: Test and build

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - 'doc/**'
      - '**/*.rst'
      - .gitignore
  release:
    types:
      - published

jobs:
  test:
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        include:
          - name: Test suite with python 3.9
            python-version: "3.9"
            toxenv: "py39"
          - name: Test suite with python 3.10
            python-version: "3.10"
            toxenv: "py310"
          - name: Run linters
            python-version: "3.10"
            toxenv: "lint"
          - name: Typecheck on python 3.9
            python-version: "3.9"
            toxenv: "py39-typing"
          - name: Typecheck on python 3.10
            python-version: "3.10"
            toxenv: "py310-typing"
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "tox<4"
      - name: Build extensions
        run: python setup.py build_ext --inplace
      - name: Setup tox env
        run: tox -e ${{ matrix.toxenv }} --notest
      - name: Run tox
        run: tox -e ${{ matrix.toxenv }} --skip-pkg-install
      - name: Rename coverage file
        run: (test -f .coverage && mv .coverage .coverage.${{ matrix.toxenv }}) || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage
          path: .coverage.${{ matrix.toxenv }}
          include-hidden-files: true
          if-no-files-found: ignore

  upload_coverage:
    name: Upload coverage to codecov
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - name: Set up Python 3.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install coverage[toml]
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: coverage
          path: coverage
      - name: Combine coverage files
        run: |
          coverage combine coverage
          coverage xml
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}


  make_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install build

      - name: Build package
        run: python -m build --sdist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/*.tar.gz

  upload:
    name: Upload to PyPi
    needs: [make_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
